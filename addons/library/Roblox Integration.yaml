Type: GameLibrary
Name: Roblox Integration
Author: Horrid-12
ShortDescription: Imports your favorited Roblox experiences seamlessly into Playnite.
Description: |
  A robust Playnite integration that automatically syncs and imports your favorited Roblox experiences as playable games within Playnite. 
  
  Features:
  - Imports games from your favorited Roblox experiences.
  - Automatically fetches game titles.
  - One-click launch directly into the Roblox Player via the `roblox://` protocol.
  - Seamlessly integrates with Playnite themes like eMixedNiteMC, providing custom banners and icons for a native feel.
  - Secure `.ROBLOSECURITY` cookie authentication with local-only storage.
