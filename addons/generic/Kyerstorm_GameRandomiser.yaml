SourceUrl: https://github.com/Kyerstorm/Playnite-Game-Randomiser
Description: |
    A Wheel-of-Names style game picker built natively into Playnite's sidebar. Create multiple
    named wheels manually or from criteria (filter, genre, platform, tag, category, play status,
    playtime, installed state). Spins are cryptographically random and equal-probability, with an
    animated wheel, tick sounds, spin history, and a winner card offering Install/Launch/View
    details. Fully offline, no web dependency.
