SourceUrl: https://github.com/metanmai/playnite-link
Description: |
  Synchronize selected saves, playtime and session history through your own Rclone cloud storage. Includes conflict review, restore backups, device controls, optional extension/theme installation sharing and a local passcode. No Playnite Link account server is required.

  Ordinary launches use local saves without waiting for cloud access. Remote save replacement is deferred during play; known conflicts require review. Sync first when switching devices if you need the newest remote save before starting.

  GameActivity 3.7 and HowLongToBeat 3.13 were tested. Online HLTB updates are opt-in and require its local sign-in and an existing mapped profile entry. Active themes, application/addon settings and other sign-ins remain local.

  Requires Playnite 10.62+, Windows and an authorized Rclone storage connection. New Google Drive connections currently require a personal Desktop OAuth client JSON; see setup instructions. Save folders need a local selection per game/device. Addon installation sharing is opt-in.
Tags: [Saves, Cloud, Playtime, Synchronization, GameActivity]
