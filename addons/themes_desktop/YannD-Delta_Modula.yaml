ShortDescription: 'Liquid-glass desktop theme, editable live with the Layout Studio extension. Made with Claude Code.'
Description: 'Modula is a liquid-glass desktop theme: translucent panels, soft glows, the game art washing over the page, header information cards, sections you can reorder, 14 colour profiles and 9 accents. Settings are edited live with the Layout Studio extension (https://github.com/YannD-Delta/Layout-Studio). Based on Neon, Helium and Dune Rev (MIT).'
