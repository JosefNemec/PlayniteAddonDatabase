ShortDescription: A dark, cinematic Desktop theme with trailer backgrounds and broad extension support.
Description: |-
    Covers on a pure black grid, a slim sidebar, a top bar that stays out of the way, and a details page with the trailer as its background.
    Works with no extensions installed. Each integration appears only when its extension is installed and has something for the selected game.
    Colours and layout options are configurable through ThemeModifier, including a performance mode for large libraries and slower machines.
    Designed at 4K with 150% scaling. English only.

    Supported extension integrations:
    - ThemeModifier (colours, performance mode, reduce motion, grid and details options)
    - Extra Metadata Loader (trailer background + game logo as title)
    - ThemeExtras (favourite, completion status, rating, link icons)
    - HowLongToBeat
    - Playnite Achievements
    - GameActivity
    - Screenshot Utilities
    - News Viewer
    - Review Viewer
    - Universal Steam Player Count
    - CheckDlc
    - Game Relations
    - PlayNotes
    - ImageRotater
