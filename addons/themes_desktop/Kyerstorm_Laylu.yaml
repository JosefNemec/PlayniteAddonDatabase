FaqTopics:
  - Name: Where are the Laylu theme settings?
    Answer: Install the ThemeModifier extension and restart Playnite. Laylu's colours and options then appear in ThemeModifier's settings. Without it the defaults apply.
  - Name: Why is there no trailer or logo on the details page?
    Answer: Both come from the Extra Metadata Loader extension. Install it and download a video and a logo for the game.
  - Name: Laylu feels slow on my machine or with a large library
    Answer: Turn on Performance mode in ThemeModifier. It removes the cover glow, the rounded covers and the trailer background.
