FaqTopics:
  - Name: How is manga time calculated?
    Answer: AniList has no page counts, so it is an estimate based on your reading speed. With the default 200 pages per volume and 18 seconds per page, the extension derives pages per chapter from the volume and chapter counts (limited to 6-120) and multiplies it by the chapters you have read. That works out to about one hour per volume. Light novels use 12 minutes per chapter, one-shots count as one full volume, and webtoons (countryOfOrigin KR or CN) use 10 minutes per chapter. If the result does not match how fast you read, change Seconds per page in the extension settings.
  - Name: Why did my game get no time?
    Answer: The extension only touches games imported by Importer for AniList, and it needs to find the AniList id. Version 1.0 and older read it from the game's links, so games imported with addLinksAndImages disabled were skipped. Since 1.1 it reads Game.GameId first, which fixes that. Also check that the entry has progress greater than zero on AniList, and that the anime or manga option is enabled in the settings.
  - Name: Does it launch the anime or manga?
    Answer: No. It only writes Playnite's Playtime field, so your collection shows up in the statistics next to your games. It does not start a player, a reader or a browser tab.
  - Name: How do I install it?
    Answer: From Playnite's add-on browser, or download the .pext from the releases page and drag it into an open Playnite window. Importer for AniList must be installed and authenticated, because Playtime AniList reuses its access token. You can also paste your own token in the settings.
