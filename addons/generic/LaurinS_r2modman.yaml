Type: Generic
Name: 'r2modman Launch Options'
Author: 'Laurin Sorgend'
ShortDescription: 'Adds launch entries for r2modman profiles to supported Steam games.'
Description: 'Reads r2modman profiles from disk and adds them as launch options on supported Steam games, so you can pick a modded profile from the Play menu. Profiles are read live, so there is nothing to keep in sync. Game support is generated from r2modman''s upstream ecosystem list and can be extended with manual overrides in the settings. Covers BepInEx 5 and 6 games via Doorstop 3 and 4.'
