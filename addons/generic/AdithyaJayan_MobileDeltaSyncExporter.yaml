Description: |
  Mobile Delta Sync Exporter pairs your desktop Playnite library with the open-source Android Mobile Companion app.

  Key Features:
  - O(Delta) Incremental Cloud Sync: Exports only changed game metadata and newly downloaded media when games stop running.
  - Zero Third-Party Relays: Syncs via your personal Google Drive (least-privilege drive.file scope) or Local Folder / Google Drive for Desktop.
  - Rich Metadata Extraction: Aggregates SuccessStory achievements, HowLongToBeat completion times, GameActivity session timelines, ExtraMetadataLoader micro-trailers, CheckDlc, and SteamReviews.
  - High-Performance Android Companion: Local SQLite FTS5 search, virtualized library views, looping video micro-trailers, and statistics dashboard.