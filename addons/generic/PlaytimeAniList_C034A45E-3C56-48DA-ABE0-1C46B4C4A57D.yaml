Type: Generic
Name: Playtime AniList
Author: Denka Akuma
ShortDescription: Turns your AniList progress into real play time in Playnite, so your anime and manga show up in the statistics.
InstallerManifestUrl: https://raw.githubusercontent.com/DenkaAkumaPedro/Playtime-AniList/main/Manifests/PackageInstaller/PlaytimeAniList_C034A45E-3C56-48DA-ABE0-1C46B4C4A57D.yaml
SourceUrl: https://github.com/DenkaAkumaPedro/Playtime-AniList
Description: |
  Anime and manga are not games, but they have a title, a cover, a status and a progress. What they don't have is a place in Playnite's Playtime field, which is what Playnite uses for Total Playtime, Average Playtime and Most Played in Library > Statistics. Playtime AniList fills that field from your AniList progress.

  Anime time is exact: AniList progress multiplied by the episode duration, so a half-watched series gets a proportional value. Manga time is an estimate, because AniList does not store page counts: reading time is derived from pages per volume, seconds per page and the volume/chapter counts, with separate rules for light novels, one-shots and KR/CN webtoons. With the defaults it lands at about one hour per volume, which is roughly how long a tankobon takes. Every value is configurable, and series with no chapter or volume data fall back to minutes per chapter.

  The extension can also sync on its own, at most once every 24 hours, triggered by a library update instead of running on every launch. It sets LastActivity from the AniList updatedAt value, so an entry you updated on AniList shows up in the library's Recent activity grouping and filters.

  It does not launch anything: it only writes the Playtime field. Requires Importer for AniList (its access token is reused) and Playnite 10.x with API 6.17.0 or newer.
