Description: |
  Zino's Media Center brings a Stremio-inspired media browsing and playback experience to Playnite.

  Features:
  - Browse and discover movies and TV shows
  - Explore anime through supported catalogue and add-on integrations
  - Search and browse media using available metadata and catalogue integrations
  - MPV-powered media playback
  - Configurable Stremio add-on integrations
  - Real-Debrid support through compatible add-on configurations
  - Subtitle support through supported integrations
  - Local media support

  Zino's Media Center brings media discovery and playback together in one convenient Playnite experience.
