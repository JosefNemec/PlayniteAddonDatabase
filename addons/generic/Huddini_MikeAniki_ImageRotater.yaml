Name: 'ImageRotater'
Author: 'Huddini x Mike Aniki'
SourceUrl: https://github.com/Mike-Aniki/ImageRotater
IconUrl: https://raw.githubusercontent.com/Mike-Aniki/ImageRotater/main/icon.png
Description: ImageRotater lets each game use multiple covers and backgrounds instead of a single static artwork. Add your own images or find new ones online, then choose how and when they change automatically. Static artwork works with regular Playnite themes, while compatible themes can also display animated GIF and video artwork.
