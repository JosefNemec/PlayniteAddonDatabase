Name: Payload
Author: danitesler
ShortDescription: 'A dark theme inspired by the Overwatch 2 menus: navy panels, cyan selection, slanted orange Play plate, team-colored scores.'
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/Payload/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/Payload
Description: |
  Navy panels from the career profile, the game's cyan selection with black type, an OW2-orange Play button slanted 15 degrees like the VS plates, oblique display headings and scores in the team colors, inspired by the Overwatch 2 menus. Unofficial fan theme: no Blizzard assets, original artwork only. Install BigNoodleTooOblique (and Config) for the closest type; otherwise it falls back to Bahnschrift.
Tags: [Dark, Desktop]
