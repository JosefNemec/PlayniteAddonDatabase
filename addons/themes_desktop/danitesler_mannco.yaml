Name: Mann Co
Author: danitesler
ShortDescription: 'A dark theme inspired by the Team Fortress 2 menus: tan paper buttons, rust hover, RED and BLU rule on the top bar.'
InstallerManifestUrl: https://raw.githubusercontent.com/danitesler/playnite-extensions/main/src/themes/MannCo/info/InstallerManifest.yaml
SourceUrl: https://github.com/danitesler/playnite-extensions/tree/main/src/themes/MannCo
Description: |
  Dark brown pages, tan paper plates for whatever you press or select, rust on hover and a thin RED and BLU rule under the top bar, inspired by the Team Fortress 2 menus. Unofficial fan theme: no Valve assets, original artwork only. Uses Verdana and Trebuchet MS, Valve's own Windows fallbacks for its UI fonts.
Tags: [Dark, Desktop]
