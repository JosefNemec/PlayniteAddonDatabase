Type: Generic
Name: Playnite Link
Author: metanmai
ShortDescription: Sync game saves across Playnite devices with backups and conflict review.
InstallerManifestUrl: https://raw.githubusercontent.com/metanmai/playnite-link/main/catalog/installer.yaml
SourceUrl: https://github.com/metanmai/playnite-link
Description: |
  Keep game saves in sync across Playnite devices using your own cloud storage. Link checks configured saves before a game launches and queues changes for upload after you quit. Review both versions when saves diverge, and restore earlier saves from the backup history.

  Link a game on both devices and choose its save paths on each one. Steam and Epic games use their launcher for saves by default. Session history and playtime can also sync through the same vault.

  Requires Playnite 10.62+, .NET Framework 4.8 and an authorized Rclone storage connection. New Google Drive connections require your own Desktop OAuth client JSON. See the setup guide for details.
Tags: [Saves, Backups, Cloud, Synchronization, Playtime]
