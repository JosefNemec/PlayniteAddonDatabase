Description: |-
  A native Playnite library plugin that automatically detects, imports, and launches Star Citizen channels (LIVE, PTU, EPTU, TECH-PREVIEW) without manual path configuration.

  Features:
  - Zero-configuration detection across all fixed and removable drives.
  - Multi-channel support (LIVE, PTU, EPTU, HOTFIX, TECH-PREVIEW).
  - Accurate SSD footprint calculation and semantic game versioning.
  - Dedicated AutomaticPlayController launches via RSI Launcher with Bin64 process lifecycle tracking.
  - Single clean play action to avoid redundant selection popups.
  - Automatic extraction of pilot identity and shard/cluster info from logs.
  - Safe playtime, stats, and metadata inheritance.
  - Full English and German localization.
  - Dedicated RSI source branding for modern Playnite desktop themes (e.g. Penumbra, DuplicateHider).
  - Context menu shortcuts to Game Install directory, USER folder, and shader cache.
  - In-game r_displayinfo switcher (Levels 0-3) via user.cfg.
